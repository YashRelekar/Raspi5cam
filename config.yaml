# Raspi5cam – configuration
#
# Raspberry Pi 5 + IMX219 (Camera Module v2) emotion detection setup.
#
# The IMX219 is enabled in /boot/firmware/config.txt by adding under [all]:
#   dtoverlay=imx219,cam0

hardware:
  camera:
    # Camera device index.  With dtoverlay=imx219,cam0 the IMX219 is camera 0.
    device_index: 0
    # Show a live OpenCV preview window while running.
    # Set to false for headless / SSH sessions (or use --no-preview flag).
    preview_window: true
    # Capture resolution.  640×480 gives a good balance of speed vs. quality
    # for face detection on the Raspberry Pi 5.
    width: 640
    height: 480
    # Frames per second.  15 fps is comfortable for real-time inference.
    fps: 15

models:
  # Path to the TFLite facial-emotion model.
  # Download it with:  bash scripts/download_models.sh
  face_emotion_model: "models/face_emotion.tflite"

  # Ordered label list — must match the training order of the model.
  # Order matches the oarriaga/face_classification FER-2013 mini-XCEPTION model.
  emotion_labels:
    - angry
    - disgust
    - fear
    - happy
    - sad
    - surprise
    - neutral

  # Minimum confidence score (0–1) to accept a prediction.
  confidence_threshold: 0.25

display:
  # Show the confidence percentage next to each emotion label.
  show_confidence: true

logging:
  level: "INFO"
  # Log file path; leave empty to log to stdout only.
  file: ""
