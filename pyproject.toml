[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raspi5cam"
version = "0.1.0"
description = "Raspberry Pi 5 camera project (rebuilding)"
requires-python = ">=3.11"

[project.scripts]
raspi5cam = "raspi5cam.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
